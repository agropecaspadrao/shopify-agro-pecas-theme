<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{
    --txt: oklch(0.36 0.045 158);
    --muted: oklch(0.50 0.03 158 / .82);
    --faint: oklch(0.50 0.03 158 / .5);
    --gold: oklch(0.58 0.09 80);
    --ok: oklch(0.58 0.11 155);
    --warn: oklch(0.64 0.10 68);
    --err: oklch(0.56 0.13 28);
    --glass: oklch(1 0 0 / .52);
    --glass-2: oklch(1 0 0 / .72);
    --line: oklch(0.36 0.04 158 / .13);
    --line-2: oklch(0.36 0.04 158 / .07);
    --radius: 22px;
    --ease: cubic-bezier(.22,1,.36,1);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{min-height:100%}
  body{
    color:var(--txt);
    background: oklch(0.975 0.012 155);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding-bottom:60px;
  }
  /* fundo "liquid": brilhos que derivam lentamente, atrás do vidro */
  .bg{position:fixed; inset:-20% ; z-index:-1; overflow:hidden}
  .bg::before, .bg::after{content:""; position:absolute; border-radius:50%; filter:blur(80px); opacity:.85}
  .bg::before{width:62vw; height:62vw; left:-12vw; top:-12vw;
    background: radial-gradient(circle, oklch(0.90 0.055 155 / .75), transparent 70%);
    animation: drift1 30s var(--ease) infinite alternate}
  .bg::after{width:56vw; height:56vw; right:-10vw; bottom:-14vw;
    background: radial-gradient(circle, oklch(0.93 0.05 88 / .7), transparent 70%);
    animation: drift2 36s var(--ease) infinite alternate}
  .bg i{position:absolute; width:46vw; height:46vw; left:32vw; top:36vh; border-radius:50%; filter:blur(90px); opacity:.6;
    background: radial-gradient(circle, oklch(0.92 0.045 205 / .6), transparent 70%);
    animation: drift3 42s var(--ease) infinite alternate}
  @keyframes drift1{to{transform:translate(14vw,10vh) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-12vw,-8vh) scale(1.2)}}
  @keyframes drift3{to{transform:translate(-16vw,12vh) scale(1.1)}}
  @media (prefers-reduced-motion: reduce){ .bg::before,.bg::after,.bg i{animation:none} }

  .glass{
    background: var(--glass);
    backdrop-filter: blur(26px) saturate(165%);
    -webkit-backdrop-filter: blur(26px) saturate(165%);
    border:1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 10px 32px oklch(0.45 0.06 158 / .12), inset 0 1px 0 oklch(1 0 0 / .7);
  }
  .app{max-width:1200px; margin:0 auto; padding:28px 22px}

  /* HERO */
  .hero{display:flex; align-items:center; gap:20px; padding:22px 26px; margin-bottom:22px}
  .hero .logo{width:60px; height:60px; border-radius:16px; flex-shrink:0;
    box-shadow:0 6px 18px oklch(0.45 0.06 158 / .16); background:oklch(1 0 0 / .55)}
  .hero h1{font-size:26px; font-weight:700; letter-spacing:-.02em}
  .hero p{font-size:13px; color:var(--muted); margin-top:2px; letter-spacing:.01em}
  .hero-meta{margin-left:auto; text-align:right; font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:8px; align-items:flex-end}
  .pill{display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:100px;
    background:var(--glass-2); border:1px solid var(--line-2); font-weight:600; color:var(--txt)}
  .pill .dot{width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok)}
  .upd b{color:var(--gold); font-weight:700}
  @media(max-width:640px){ .hero{flex-wrap:wrap} .hero-meta{margin-left:0; align-items:flex-start; text-align:left; width:100%} }

  /* SAÚDE — cenários de teste como faixa de status */
  .health{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:22px}
  .hx{padding:15px 16px; cursor:pointer; transition:transform .4s var(--ease)}
  .hx:hover{transform:translateY(-3px)}
  .hx .top{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--muted); line-height:1.3}
  .hx .st{font-size:19px; font-weight:800; margin-top:9px; display:flex; align-items:baseline; gap:7px}
  .hx .st small{font-size:12px; font-weight:600; color:var(--muted)}
  .tick{width:20px; height:20px; border-radius:50%; flex-shrink:0; display:grid; place-items:center; font-size:12px; font-weight:900}
  .tick.ok{background:oklch(0.58 0.11 155 / .15); color:var(--ok)}
  .tick.bad{background:oklch(0.56 0.13 28 / .15); color:var(--err)}

  /* KPIs em bento (tamanhos variados) */
  .bento{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px}
  .k{padding:18px 20px; cursor:default; position:relative; transition:transform .4s var(--ease)}
  .k.link{cursor:pointer}
  .k.link:hover{transform:translateY(-3px)}
  .k .n{font-size:32px; font-weight:800; letter-spacing:-.03em; line-height:1}
  .k .l{font-size:12.5px; color:var(--muted); margin-top:8px}
  .k .arrow{position:absolute; top:16px; right:16px; color:var(--faint); font-size:14px; transition:.3s var(--ease)}
  .k.link:hover .arrow{color:var(--gold); transform:translateX(3px)}
  .k.wide{grid-column:span 2}
  .k .n.gold{color:var(--gold)} .k .n.warn{color:var(--warn)} .k .n.err{color:var(--err)} .k .n.ok{color:var(--ok)}
  @media(max-width:900px){ .bento{grid-template-columns:repeat(2,1fr)} .k.wide{grid-column:span 2} }

  /* DETALHES + segmented control */
  .details{padding:8px}
  .seg{display:flex; gap:4px; padding:6px; overflow-x:auto; scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:0 0 auto; border:0; background:transparent; color:var(--muted); font-size:13.5px; font-weight:600;
    padding:9px 15px; border-radius:14px; cursor:pointer; white-space:nowrap; transition:.3s var(--ease); font-family:inherit}
  .seg button:hover{color:var(--txt)}
  .seg button.on{background:var(--glass-2); color:var(--txt); box-shadow:inset 0 1px 0 oklch(1 0 0 / .2)}
  .seg button .c{margin-left:7px; font-size:11px; font-weight:800; color:var(--gold)}

  .panel{display:none; padding:20px 22px 24px; animation:fade .45s var(--ease)}
  .panel.on{display:block}
  @keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .panel h2{font-size:17px; font-weight:700; letter-spacing:-.01em; margin-bottom:5px}
  .why{font-size:13px; color:var(--muted); line-height:1.5; margin-bottom:16px; max-width:75ch}

  table{width:100%; border-collapse:collapse; font-size:13px}
  thead th{text-align:left; color:var(--faint); font-weight:600; font-size:11.5px; text-transform:uppercase;
    letter-spacing:.05em; padding:0 12px 10px; border-bottom:1px solid var(--line-2)}
  tbody td{padding:11px 12px; border-bottom:1px solid var(--line-2); vertical-align:top; line-height:1.4}
  tbody tr:last-child td{border-bottom:0}
  tbody tr{transition:background .2s}
  tbody tr:hover{background:oklch(0.90 0.05 155 / .22)}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; color:var(--gold);
    background:oklch(0.58 0.09 80 / .1); padding:2px 7px; border-radius:6px; white-space:nowrap}
  .tag{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:100px}
  .tag.ok{background:oklch(0.58 0.11 155 / .15); color:var(--ok)}
  .tag.media{background:oklch(0.64 0.10 68 / .16); color:var(--warn)}
  .tag.ruim{background:oklch(0.56 0.13 28 / .15); color:var(--err)}
  .scr{max-height:52vh; overflow:auto}
  .empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:14px}
  .empty .big{font-size:34px; margin-bottom:8px}
  .steps{counter-reset:s; margin:6px 0 18px; padding:16px 18px; border-radius:16px; background:oklch(0.90 0.05 155 / .28); border:1px solid var(--line-2)}
  .steps li{list-style:none; counter-increment:s; position:relative; padding:6px 0 6px 34px; font-size:13.5px; line-height:1.5}
  .steps li::before{content:counter(s); position:absolute; left:0; top:5px; width:22px; height:22px; border-radius:50%;
    background:var(--gold); color:oklch(0.99 0 0); font-weight:800; font-size:12px; display:grid; place-items:center}
  .rule{padding:14px 0; border-bottom:1px solid var(--line-2)}
  .rule:last-child{border-bottom:0}
  .rule b{color:var(--gold); font-size:13.5px}
  .rule p{color:var(--muted); font-size:13px; line-height:1.55; margin-top:5px; max-width:80ch}
  footer{text-align:center; color:var(--faint); font-size:12px; margin-top:30px}
</style>
</head>

<script>
var D = <?!= JSON.stringify(dados) ?>;
var USER = <?!= JSON.stringify(usuario) ?>;
var k = D.kpis || {};
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function num(id,v){var e=document.getElementById(id); if(e) e.textContent=v;}
num('userTxt', USER); num('geradoEm', D.gerado_em||'—');

/* ---- saúde: cenários ---- */
var health=document.getElementById('health');
(D.cenarios||[]).forEach(function(c){
  var ok=String(c.status)==='OK';
  var el=document.createElement('div'); el.className='hx glass';
  el.innerHTML='<div class="top"><span class="tick '+(ok?'ok':'bad')+'">'+(ok?'✓':'!')+'</span>'+esc(c.cenario)+'</div>'+
    '<div class="st">'+c.passou+'<small>/ '+c.total+' ok</small></div>';
  el.onclick=function(){show('cenarios');};
  health.appendChild(el);
});

/* ---- KPIs (bento) ---- */
function kpi(n,l,cls,target,wide){
  var arrow= target?'<span class="arrow">→</span>':'';
  return '<div class="k glass'+(target?' link':'')+(wide?' wide':'')+'"'+(target?' data-t="'+target+'"':'')+'>'+
    arrow+'<div class="n '+(cls||'')+'">'+n+'</div><div class="l">'+l+'</div></div>';
}
document.getElementById('kpis').innerHTML=
  kpi(k.produtos_site,'Produtos no site',null,null,false)+
  kpi(k.itens_olist_ativos,'Itens ativos no Olist',null,null,false)+
  kpi(k.skus_planilha,'SKUs ativos na planilha',null,null,false)+
  kpi((k.pct_com_foto||0)+'%','Com foto',(k.pct_com_foto<80?'warn':'ok'),'fotos',false)+
  kpi(k.sem_foto,'Sem foto',(k.sem_foto>0?'warn':'ok'),'fotos',false)+
  kpi(k.score_medio,'Score médio de descrição','gold','descricoes',true)+
  kpi(k.div_custo_planilha,'Diverg. de custo',(k.div_custo_planilha>0?'err':'ok'),'custos',false)+
  kpi(k.inativos_olist,'Inativos p/ limpar',(k.inativos_olist>0?'warn':'ok'),'inativos',false);

/* ---- painéis (drill-down) ---- */
function tbl(cols, rows, render){
  if(!rows||!rows.length) return '<div class="empty"><div class="big">✓</div>Nada a listar aqui.</div>';
  var h='<div class="scr"><table><thead><tr>'+cols.map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr></thead><tbody>';
  h+=rows.map(function(r){return '<tr>'+render(r)+'</tr>';}).join('');
  return h+'</tbody></table></div>';
}
function faixaTag(f){return '<span class="tag '+(f==='boa'?'ok':f)+'">'+f+'</span>';}

var PANELS = {
  fotos: {t:'Produtos sem foto', c:k.sem_foto+' de '+k.produtos_site,
    why:'Por que importa: produto ativo sem imagem converte menos e some visualmente na busca e nas coleções. Ação: subir a foto (3D + desenho técnico) de cada item abaixo.',
    html:function(){return tbl(['SKU','Produto','Tipo'], D.sem_foto, function(r){
      return '<td><span class="mono">'+esc(r.sku)+'</span></td><td>'+esc(r.titulo)+'</td><td>'+esc(r.tipo)+'</td>';});}},
  descricoes: {t:'Descrições a melhorar', c:(D.desc_ruins||[]).length,
    why:'Regra do score (0-100): começa em 100 e desconta sem foto (-30), descrição curta <200 caracteres (-20), título cru (-15), sem Compatibilidade (-10), sem Especificações (-10), resíduo de espanhol (-15). Abaixo, tudo com score < 80 e o motivo exato.',
    html:function(){return tbl(['SKU','Produto','Faixa','Score','Motivos'], D.desc_ruins, function(r){
      return '<td><span class="mono">'+esc(r.sku)+'</span></td><td>'+esc(r.titulo)+'</td><td>'+faixaTag(r.faixa)+'</td><td>'+r.score+'</td><td style="color:var(--muted)">'+esc(r.motivos)+'</td>';});}},
  custos: {t:'Divergência de custo · Site × Planilha', c:(D.div_custo||[]).length,
    why:'Regra: compara o custo unitário do site com o da planilha. Para kits (sufixo -KITn), considera a quantidade: aceita o valor da planilha como unitário OU como pacote (unitário × qtd). Só listamos divergência real (fora da tolerância de arredondamento).',
    html:function(){return tbl(['SKU','Produto','Tipo','Site','Planilha','Por quê'], D.div_custo, function(r){
      return '<td><span class="mono">'+esc(r.sku)+'</span></td><td>'+esc(r.titulo)+'</td><td>'+esc(r.tipo)+'</td><td>R$ '+r.site+'</td><td>R$ '+r.planilha+'</td><td style="color:var(--muted)">'+esc(r.motivo)+'</td>';});}},
  precos: {t:'Divergência de preço · Site × Olist', c:(D.div_preco||[]).length,
    why:'Regra: preço de venda no site deve ser igual ao do Olist. Divergência indica Olist com preço defasado da última sincronização (o site foi reajustado depois).',
    html:function(){return tbl(['SKU','Produto','Site','Olist','Por quê'], D.div_preco, function(r){
      return '<td><span class="mono">'+esc(r.sku)+'</span></td><td>'+esc(r.titulo)+'</td><td>R$ '+r.site+'</td><td>R$ '+r.olist+'</td><td style="color:var(--muted)">'+esc(r.motivo)+'</td>';});}},
  importantes: {t:'Itens importantes com pendência', c:(D.importantes||[]).length,
    why:'Bombas (categoria âncora) ativas no site com algo faltando (foto, custo ou descrição fraca). São os itens de maior valor, priorize-os.',
    html:function(){return tbl(['SKU','Produto','O que falta'], D.importantes, function(r){
      return '<td><span class="mono">'+esc(r.sku)+'</span></td><td>'+esc(r.titulo)+'</td><td style="color:var(--warn)">'+esc(r.falta)+'</td>';});}},
  inativos: {t:'Limpeza do Olist · itens inativos', c:(D.inativos||[]).length,
    why:'São resíduos [OLD]/[DUP] da conversão pai→simples. Ficam inativos poluindo a operação. A API v2 do Tiny não exclui, então a limpeza é manual (2 min):',
    steps:['No Olist/Tiny, abra Produtos e filtre Situação = Inativo.','Selecione todos e use Excluir em massa.','Confirme. Não afeta pedidos nem NF (o histórico fica nos registros).'],
    html:function(){return tbl(['ID Tiny','Código','Nome'], D.inativos, function(r){
      return '<td><span class="mono">'+esc(r.id)+'</span></td><td>'+esc(r.codigo)+'</td><td style="color:var(--muted)">'+esc(r.nome)+'</td>';});}},
  cenarios: {t:'Cenários de teste · Planilha × Site × Olist', c:(D.cenarios||[]).length,
    why:'Cada cenário é uma regra de negócio que deve estar sempre verde. Clique mostra o que ele verifica e as exceções.',
    html:function(){return (D.cenarios||[]).map(function(c){
      var ok=String(c.status)==='OK'; var exc=[]; try{exc=JSON.parse(c.excecoes||'[]');}catch(e){}
      var lista= exc.length? '<div style="margin-top:8px;font-size:12px;color:var(--faint)">Exceções: '+exc.slice(0,20).map(function(x){return esc(x.sku||x.codigo||x.nome||x.id||JSON.stringify(x));}).join(' · ')+(exc.length>20?' …':'')+'</div>':'';
      return '<div class="rule"><b style="color:'+(ok?'var(--ok)':'var(--err)')+'">'+(ok?'✓ ':'! ')+esc(c.cenario)+' · '+c.passou+'/'+c.total+'</b><p>'+esc(c.descricao)+lista+'</p></div>';
    }).join('');}},
  regras: {t:'Regras e metodologia', c:(D.regras||[]).length,
    why:'Como cada número é calculado e de onde vem. Transparência total para o time confiar nos dados.',
    html:function(){return (D.regras||[]).map(function(r){
      return '<div class="rule"><b>'+esc(r.campo)+'</b><p>'+esc(r.regra)+'</p></div>';}).join('');}}
};
var ORDER=['fotos','descricoes','custos','precos','importantes','inativos','cenarios','regras'];
var LABEL={fotos:'Fotos',descricoes:'Descrições',custos:'Custos',precos:'Preços',importantes:'Importantes',inativos:'Inativos',cenarios:'Cenários',regras:'Regras'};

var seg=document.getElementById('seg'), panelsEl=document.getElementById('panels');
ORDER.forEach(function(key){
  var p=PANELS[key];
  var b=document.createElement('button'); b.dataset.k=key;
  b.innerHTML=LABEL[key]+(p.c?'<span class="c">'+p.c+'</span>':'');
  b.onclick=function(){show(key);}; seg.appendChild(b);
  var d=document.createElement('div'); d.className='panel'; d.id='p-'+key;
  var steps= p.steps? '<ol class="steps">'+p.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol>':'';
  d.innerHTML='<h2>'+esc(p.t)+'</h2><p class="why">'+p.why+'</p>'+steps+p.html();
  panelsEl.appendChild(d);
});
function show(key){
  ORDER.forEach(function(x){
    document.getElementById('p-'+x).classList.toggle('on', x===key);
    seg.querySelector('button[data-k="'+x+'"]').classList.toggle('on', x===key);
  });
  document.querySelector('.details').scrollIntoView({behavior:'smooth', block:'start'});
}
document.querySelectorAll('.k.link').forEach(function(el){
  el.onclick=function(){show(el.dataset.t);};
});
show('fotos');
</script>
</body>
</html>
